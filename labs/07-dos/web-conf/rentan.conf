# Setelan Apache untuk target RENTAN.
# Berkas ini di-Include paling akhir oleh perintah start di compose.yaml,
# jadi isinya menang atas httpd.conf bawaan image.
#
# Semua yang ada di sini sengaja dibuat buruk. Jangan pernah menyalin berkas
# ini ke server sungguhan.

# ---------------------------------------------------------------------------
# 1. Kolam pekerja dibuat sangat kecil.
#    Image httpd resmi memakai MPM event. Di MPM event, koneksi yang sedang
#    dalam proses membaca header permintaan tetap memegang satu thread
#    pekerja. Dengan MaxRequestWorkers 10, sepuluh koneksi setengah jadi
#    sudah cukup untuk menghabiskan seluruh kapasitas.
#
#    Server sungguhan memakai angka ratusan sampai ribuan. Angka 10 di sini
#    dipakai supaya efeknya terlihat dalam hitungan detik di kelas, bukan
#    supaya lab ini bisa dipakai mengukur kekuatan serangan.
# ---------------------------------------------------------------------------
<IfModule mpm_event_module>
    ServerLimit              1
    StartServers             1
    ThreadLimit              10
    ThreadsPerChild          10
    MaxRequestWorkers        10
    MinSpareThreads          10
    MaxSpareThreads          10
    MaxConnectionsPerChild   0
    AsyncRequestWorkerFactor 1
</IfModule>

# Antrean SYN dan antrean accept dikecilkan jadi empat.
# Ini yang bikin SYN flood berskala satu laptop punya efek yang bisa diukur.
# Angka ini diuji, bukan ditebak: dengan ListenBacklog 16, kernel Linux modern
# memangkas sendiri antrean SYN-nya lebih cepat daripada skrip kami mengisinya,
# 63 ribu paket per detik pun tidak menjatuhkan apa pun. Dengan 4, permintaan
# koneksi yang sah mulai ditolak. Server sungguhan memakai 511 ke atas.
ListenBacklog 4

# ---------------------------------------------------------------------------
# 2. Semua batas waktu dilonggarkan.
#    Timeout 300 berarti klien boleh diam lima menit di tengah permintaan
#    tanpa diputus. KeepAliveTimeout 300 berarti koneksi menganggur juga
#    dipertahankan lima menit.
# ---------------------------------------------------------------------------
Timeout 300
KeepAlive On
KeepAliveTimeout 300
MaxKeepAliveRequests 1000

# ---------------------------------------------------------------------------
# 3. mod_reqtimeout DIMATIKAN.
#    Modul ini sudah dimuat oleh httpd.conf bawaan image, dan sejak Apache
#    2.4.39 ia punya nilai bawaan yang cukup untuk mengganggu slowloris.
#    Nilai 0 mematikannya. Baris inilah yang membuat lab ini bisa jatuh, dan
#    baris inilah juga yang nanti Anda balik di aman.conf.
# ---------------------------------------------------------------------------
RequestReadTimeout header=0 body=0

# ---------------------------------------------------------------------------
# 4. Satu berkas besar, dibuat 8 MB oleh perintah start di compose.yaml.
#    Gunanya: membuktikan bahwa HTTP flood baru menggigit kalau yang diminta
#    mahal. Membanjiri halaman statis 579 byte tidak menjatuhkan Apache, dan
#    itu hasil yang memang harus Anda lihat sendiri sebelum percaya.
#    Berkas ini ada di /tmp container, tidak ikut ke git.
# ---------------------------------------------------------------------------
Alias "/laporan.bin" "/tmp/laporan.bin"
<Directory "/tmp">
    Require all granted
</Directory>

# ---------------------------------------------------------------------------
# 5. Halaman metrik.
#    mod_status sudah dimuat oleh httpd.conf bawaan image. ExtendedStatus On
#    membuat Apache mencatat status tiap pekerja, dan /server-status?auto
#    memberi keluaran satu baris per angka yang gampang dibaca skrip.
#
#    Di server sungguhan halaman ini WAJIB dibatasi, karena isinya membocorkan
#    URL yang sedang diakses pengguna lain. Di sini sengaja dibuka.
# ---------------------------------------------------------------------------
ExtendedStatus On
<Location "/server-status">
    SetHandler server-status
    Require all granted
</Location>

# Penanda mode, dibaca peserta lewat header respons. mod_headers sudah dimuat
# oleh httpd.conf bawaan image, jadi tidak perlu LoadModule di sini.
Header always set X-Lab-Mode "rentan"
