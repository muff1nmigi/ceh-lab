# Setelan Apache untuk target TERMITIGASI.
#
# Kolam pekerjanya SAMA PERSIS dengan rentan.conf, sepuluh thread. Itu
# disengaja. Kalau server ini diberi kapasitas lebih besar, perbandingannya
# jadi tidak jujur: yang terukur bukan mitigasinya, tapi tambahan sumber
# dayanya. Yang berbeda cuma batas waktu dan disiplin koneksi.
#
# Bandingkan sendiri: diff web-conf/rentan.conf web-conf/aman.conf

<IfModule mpm_event_module>
    ServerLimit              1
    StartServers             1
    ThreadLimit              10
    ThreadsPerChild          10
    MaxRequestWorkers        10
    MinSpareThreads          10
    MaxSpareThreads          10
    MaxConnectionsPerChild   0
    AsyncRequestWorkerFactor 1
</IfModule>

# Antrean SYN dan antrean accept dikecilkan jadi empat.
# Ini yang bikin SYN flood berskala satu laptop punya efek yang bisa diukur.
# Angka ini diuji, bukan ditebak: dengan ListenBacklog 16, kernel Linux modern
# memangkas sendiri antrean SYN-nya lebih cepat daripada skrip kami mengisinya,
# 63 ribu paket per detik pun tidak menjatuhkan apa pun. Dengan 4, permintaan
# koneksi yang sah mulai ditolak. Server sungguhan memakai 511 ke atas.
#
# Angkanya SENGAJA sama dengan target rentan. Kalau server ini diberi antrean
# yang lebih panjang, yang terukur bukan mitigasinya lagi. Satu-satunya beda
# di lapisan kernel adalah SYN cookies, dan itu diatur di compose.yaml lewat
# sysctls, bukan di berkas ini.
ListenBacklog 4

# ---------------------------------------------------------------------------
# MITIGASI 1. Batas waktu dipendekkan.
#    Timeout 10 memutus klien yang diam lebih dari sepuluh detik di tengah
#    permintaan. KeepAliveTimeout 2 memulangkan koneksi menganggur dalam dua
#    detik, bukan lima menit.
# ---------------------------------------------------------------------------
Timeout 10
KeepAlive On
KeepAliveTimeout 2
MaxKeepAliveRequests 100

# ---------------------------------------------------------------------------
# MITIGASI 2. mod_reqtimeout dinyalakan. Ini baris yang membunuh slowloris.
#    header=3-6 artinya: klien punya 3 detik untuk mengirim seluruh header,
#    dan batas itu boleh molor sampai maksimal 6 detik selama ia benar-benar
#    mengirim data. MinRate=500 artinya tiap 500 byte yang diterima menambah
#    satu detik. Slowloris mengirim beberapa byte per belasan detik, jadi ia
#    tidak akan pernah memenuhi syarat itu dan koneksinya diputus.
#    body=6 memberlakukan aturan yang sama untuk badan permintaan, yang
#    menutup varian R-U-Dead-Yet alias RUDY.
# ---------------------------------------------------------------------------
RequestReadTimeout header=3-6,MinRate=500 body=6,MinRate=500

# ---------------------------------------------------------------------------
# MITIGASI 3. mod_ratelimit.
#    JUJUR SOAL BATASNYA: ini pembatas BANDWIDTH per koneksi, satuannya
#    KiB per detik, bukan pembatas jumlah permintaan per detik. Apache bawaan
#    tidak punya pembatas jumlah permintaan sama sekali. Dipasang di sini
#    supaya Anda tahu bedanya, dan supaya tahu bahwa "rate limit" di soal
#    ujian bisa berarti dua hal yang sangat berbeda. Yang benar-benar
#    membatasi jumlah permintaan dibahas di bagian "Yang tidak bisa" di README.
# ---------------------------------------------------------------------------
LoadModule ratelimit_module modules/mod_ratelimit.so
<Location "/">
    SetOutputFilter RATE_LIMIT
    SetEnv rate-limit 2048
</Location>

# ---------------------------------------------------------------------------
# Berkas besar yang sama dengan yang ada di target rentan, supaya kedua
# server bisa dibanjiri dengan permintaan yang persis sama.
# ---------------------------------------------------------------------------
Alias "/laporan.bin" "/tmp/laporan.bin"
<Directory "/tmp">
    Require all granted
</Directory>

ExtendedStatus On
<Location "/server-status">
    SetHandler server-status
    Require all granted
</Location>

Header always set X-Lab-Mode "aman"
