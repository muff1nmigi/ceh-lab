# Lab 01 - jaringan target kecil buat latihan scanning dan enumeration.
#
# Empat target, empat protokol, semuanya native arm64 DAN amd64 jadi tidak ada
# peserta yang kena emulasi di lab ini.
#
# Yang mem-publish port ke host cuma dua: "web" dan "ssh". Keduanya nempel di
# "default" plus "edge" sesuai aturan di _shared/compose.base.yaml.
#
# "smb" dan "ftp" SENGAJA tidak mem-publish port, dan itu keputusan sadar:
#   - FTP passive memakai port data 21000 sampai 21010. Mem-publish port 21
#     saja bikin sambungan dari host nyambung lalu menggantung waktu LIST,
#     dan gejala itu jauh lebih membingungkan daripada tidak ada portnya.
#   - Port 445 di macOS sering sudah dipegang layanan berbagi berkas bawaan.
# Dua-duanya tetap dikerjakan penuh dari dalam toolbox, yang memang tempat
# peserta mengetik. Alasan ini diulang di README bagian batas.
services:

  # ---------------------------------------------------------------------
  # WEB. Sumber footprinting: nama pegawai, robots.txt, dan dua folder yang
  # tidak ditautkan dari halaman depan.
  # ---------------------------------------------------------------------
  web:
    image: httpd:2.4
    healthcheck:
      # Menuntut BARIS STATUS HTTP, bukan sekadar port yang terbuka. Port
      # terbuka tanpa layanan yang menjawab persis kegagalan yang lolos ke
      # kelas pada 2026-08-10, dan itu yang dicegah baris ini.
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/80 && printf "GET / HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q "^HTTP/1"']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    hostname: web-intranet
    networks: [default, edge]
    ports:
      - "127.0.0.1:8180:80"
    volumes:
      - ./files/web:/usr/local/apache2/htdocs:ro

  # ---------------------------------------------------------------------
  # SMB. Sengaja dibiarkan seperti file server kantor yang telat di-patch:
  # SMBv1 masih hidup dan sesi anonim tidak dibatasi. Dua-duanya temuan yang
  # keluar di exam, dan dua-duanya yang bikin null session jalan.
  # ---------------------------------------------------------------------
  smb:
    image: servercontainers/samba:a3.24.1-s4.23.8-r0
    # Healthcheck ini sengaja MENIMPA punya image, dan alasannya punya
    # riwayat. Healthcheck bawaan image menghitung proses dengan pola
    # "ps aux | grep '[0-9] [s]mbd '", yang menuntut angka tepat sebelum nama
    # proses. Di bawah emulasi apa pun, binfmt_misc memanggil biner lewat
    # jalur absolut sehingga argv[0] menjadi "/usr/sbin/smbd", karakter
    # sebelumnya garis miring, polanya meleset, dan container dilaporkan
    # unhealthy padahal layanannya sehat. Itu menghabiskan waktu penelusuran
    # panjang pada 2026-08-07.
    #
    # Yang di bawah ini bertanya ke PROTOKOLNYA: kalau SMB menjawab dan
    # menyebutkan daftar share, layanan itu hidup. Nol ketergantungan pada
    # bentuk baris ps, jadi hasilnya sama di native maupun emulasi.
    healthcheck:
      test: ["CMD", "sh", "-c", "smbclient -N -L //127.0.0.1/ 2>/dev/null | grep -q Sharename"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s
    hostname: fs-kantor
    environment:
      # mDNS dan WS-Discovery dimatikan. Keduanya tidak dipakai di latihan
      # dan cuma menambah port yang bikin hasil scan peserta ramai.
      AVAHI_DISABLE: "1"
      WSDD2_DISABLE: "1"
      SAMBA_CONF_LOG_LEVEL: "1"
      SAMBA_CONF_WORKGROUP: NUSANTARA
      SAMBA_CONF_SERVER_STRING: File Server Kantor Pusat
      SAMBA_CONF_MAP_TO_GUEST: Bad User
      # _SPACE_ jadi spasi, itu format punya image ini.
      SAMBA_GLOBAL_CONFIG_server_SPACE_min_SPACE_protocol: NT1
      SAMBA_GLOBAL_CONFIG_client_SPACE_min_SPACE_protocol: NT1
      SAMBA_GLOBAL_CONFIG_ntlm_SPACE_auth: "yes"
      SAMBA_GLOBAL_CONFIG_restrict_SPACE_anonymous: "0"
      SAMBA_GLOBAL_CONFIG_guest_SPACE_account: nobody
      SAMBA_GLOBAL_CONFIG_usershare_SPACE_allow_SPACE_guests: "yes"
      # Akun. UID sengaja dipilih supaya RID-nya rapi dan gampang dilacak
      # waktu latihan RID cycling: RID = UID x 2 + 1000.
      ACCOUNT_budi: Password123
      UID_budi: "3001"
      ACCOUNT_siti: Nusantara2026
      UID_siti: "3002"
      ACCOUNT_agus: Agustus17
      UID_agus: "3003"
      ACCOUNT_itadmin: Sup3rAdm1n
      UID_itadmin: "3004"
      SAMBA_VOLUME_CONFIG_publik: "[publik]; path=/shares/publik; guest ok = yes; read only = yes; browseable = yes; comment = Dokumen umum, boleh dibaca semua orang"
      SAMBA_VOLUME_CONFIG_keuangan: "[keuangan]; path=/shares/keuangan; guest ok = no; valid users = budi; read only = yes; browseable = yes; comment = Rekap keuangan, terbatas"
    volumes:
      - ./files/smb-publik:/shares/publik:ro
      - ./files/smb-keuangan:/shares/keuangan:ro

  # ---------------------------------------------------------------------
  # FTP. Anonim sengaja dinyalakan lewat konfigurasi yang di-mount, supaya
  # NSE ftp-anon punya sesuatu untuk ditemukan.
  #
  # KONFIGURASINYA TIDAK BOLEH DI-MOUNT LANGSUNG KE /etc/vsftpd/vsftpd.conf,
  # dan ini bukan gaya penulisan. vsftpd MENOLAK berkas konfigurasi yang bukan
  # milik root, lalu keluar dengan status 2 TANPA mencetak pesan apa pun.
  # Bind mount membawa uid host apa adanya, dan di laptop Linux uid itu 1000,
  # yang di dalam image ini kebetulan bernama "arsip". Hasilnya vsftpd mati
  # diam-diam sementara containernya tetap "Up", karena PID 1 dipegang
  # "pidproxy ... true" milik image, bukan oleh vsftpd.
  #
  # Kenapa ini pernah lolos: di macOS, bind mount dipetakan ulang jadi milik
  # root, jadi jalur ini berfungsi di mesin penyusun dan gagal di laptop
  # peserta. Kena di kelas hari pertama, 2026-08-10.
  #
  # Jadi berkasnya di-mount ke /tmp lalu disalin dengan kepemilikan root.
  # ---------------------------------------------------------------------
  ftp:
    image: delfer/alpine-ftp-server:latest
    hostname: ftp-arsip
    environment:
      USERS: "arsip|Arsip2026 budi|Password123"
    volumes:
      - ./files/ftp/vsftpd.conf:/tmp/vsftpd.conf:ro
      - ./files/ftp-anon:/var/lib/ftp:ro
    # Tiga langkah, dan urutannya penting.
    #
    # 1. Salin konfigurasi dengan kepemilikan root, alasannya di atas.
    # 2. Panggil skrip bawaan image DENGAN argumen "true". Skrip itu membuat
    #    user dari $USERS lebih dulu, baru memeriksa argumen, jadi memberi
    #    argumen membuatnya berhenti tepat sesudah user jadi.
    # 3. Jalankan vsftpd sebagai proses utama container, di foreground.
    #
    # Langkah 3 sengaja TIDAK memakai jalur bawaan image. Jalur itu menjalankan
    # vsftpd sebagai daemon lalu menjaga container hidup dengan
    # "pidproxy ... true", sehingga layanan yang mati tetap terbaca "Up".
    # Dengan vsftpd sebagai PID utama, container mati kalau layanannya mati,
    # dan itu yang seharusnya terjadi.
    command:
      - sh
      - -c
      - install -o root -g root -m 644 /tmp/vsftpd.conf /etc/vsftpd/vsftpd.conf && /bin/start_vsftpd.sh true && exec vsftpd -opasv_min_port=21000 -opasv_max_port=21010 /etc/vsftpd/vsftpd.conf
    # Healthcheck ini yang mencegah kegagalan diam terulang. Bukan sekadar
    # mengetuk port, tetapi menuntut sambutan "220" dari vsftpd, karena port
    # yang terbuka tanpa layanan yang menjawab persis situasi yang lolos
    # kemarin.
    healthcheck:
      test: ["CMD", "sh", "-c", "echo QUIT | nc -w 2 127.0.0.1 21 | grep -q '^220 '"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # ---------------------------------------------------------------------
  # SSH. Dipublish ke host supaya peserta bisa membuktikan sendiri bahwa
  # banner grabbing dari luar container memberi hasil yang sama.
  # ---------------------------------------------------------------------
  ssh:
    image: linuxserver/openssh-server:version-10.3_p1-r0
    healthcheck:
      # Menuntut sambutan protokol SSH, bukan sekadar port yang terbuka.
      test: ["CMD", "sh", "-c", "nc -w 3 127.0.0.1 2222 </dev/null | grep -q '^SSH-2.0'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    hostname: srv-jump
    networks: [default, edge]
    ports:
      - "127.0.0.1:8122:2222"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Jakarta
      USER_NAME: budi
      USER_PASSWORD: Password123
      PASSWORD_ACCESS: "true"
      SUDO_ACCESS: "false"
