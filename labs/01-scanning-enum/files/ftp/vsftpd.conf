# Konfigurasi vsftpd untuk lab 01.
#
# Dua hal yang sengaja diubah dari bawaan image:
#
# 1. Akses anonim dibuka. Itu yang bikin skrip NSE ftp-anon punya sesuatu
#    untuk ditemukan, dan itu juga temuan klasik yang keluar di exam CEH.
#
# 2. Banner diganti jadi kalimat perusahaan yang TIDAK menyebut nama produk
#    maupun versinya. Ini bahan pelajaran, bukan hiasan: peserta melihat
#    sendiri bahwa "nmap -sV" tetap menjawab vsftpd walaupun banner-nya sudah
#    disembunyikan, karena -sV mencocokkan perilaku, bukan cuma teks sambutan.
#    Diuji 2026-08-06, hasilnya "vsftpd 2.0.8 or later".

# --- yang diubah untuk lab ---
anonymous_enable=YES
anon_root=/var/lib/ftp
anon_world_readable_only=YES
no_anon_password=NO

# --- sisanya sama dengan bawaan image ---
local_enable=YES
write_enable=YES
local_umask=022
dirmessage_enable=YES
xferlog_enable=YES
connect_from_port_20=YES
vsftpd_log_file=/proc/1/fd/1
ftpd_banner=Server arsip PT Nusantara Digital. Semua aktivitas dicatat.
listen=YES
pasv_enable=YES
pasv_addr_resolve=YES
seccomp_sandbox=NO
# NO, bukan YES. vsftpd dijalankan sebagai proses utama container supaya
# container mati kalau layanannya mati. Dengan YES, vsftpd menjadi daemon di
# latar dan container tetap hidup memegang proses lain, sehingga layanan yang
# mati terbaca sebagai container sehat. Persis itu yang lolos ke kelas hari
# pertama, 2026-08-10.
background=NO
