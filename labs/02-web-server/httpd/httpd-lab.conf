# Salah konfigurasi yang SENGAJA dipasang di lab ini.
#
# Tiap blok di bawah adalah satu hal yang tidak boleh ada di server produksi,
# dan tiap blok bisa ditemukan peserta hanya dengan curl dan nikto. Baris
# komentarnya sengaja ditulis panjang supaya berkas ini ikut jadi bahan baca
# setelah kelas selesai.

# Nama server dipatok supaya httpd tidak mengeluh soal ServerName, sekaligus
# jadi contoh nama internal yang bocor ke luar lewat header.
ServerName web01.lab.internal:80

# ---------------------------------------------------------------------------
# 1. BANNER SERVER DIBUKA LEBAR
# ---------------------------------------------------------------------------
# ServerTokens Full membuat setiap balasan menyebutkan versi persis httpd dan
# sistem operasinya. ServerSignature On menambahkan baris yang sama di bawah
# halaman error dan halaman daftar direktori.
#
# Kenapa ini penting untuk exam: penyerang tidak menebak eksploit, dia
# mencocokkan versi. Server yang mengumumkan versinya sendiri memangkas
# seluruh tahap fingerprinting. Setelan yang benar adalah ServerTokens Prod
# dan ServerSignature Off.
ServerTokens Full
ServerSignature On

# ---------------------------------------------------------------------------
# 2. HEADER YANG MEMBOCORKAN TUMPUKAN TEKNOLOGI
# ---------------------------------------------------------------------------
# Header semacam ini biasanya datang dari bahasa atau perangkat di depan
# server, bukan diketik tangan. Di lab ini dipasang manual supaya hasilnya
# bisa diandalkan di semua laptop.
Header always set X-Powered-By "PHP/5.6.40"
Header always set X-Backend-Server "web01.lab.internal"

# ---------------------------------------------------------------------------
# 3. DAFTAR ISI DIREKTORI TERBUKA
# ---------------------------------------------------------------------------
# Options +Indexes membuat direktori yang tidak punya index.html menampilkan
# seluruh isinya. Folder /backup di lab ini sengaja tidak punya index.html.
<Directory "/usr/local/apache2/htdocs">
    Options +Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>
IndexOptions FancyIndexing HTMLTable VersionSort NameWidth=*

# ---------------------------------------------------------------------------
# 4. BERKAS CADANGAN IKUT DILAYANI
# ---------------------------------------------------------------------------
# Ini bukan satu baris konfigurasi, melainkan satu baris yang HILANG. Karena
# tidak ada aturan yang menolak akhiran .bak, .old, dan .save, berkas cadangan
# yang tertinggal di document root dilayani apa adanya sebagai teks biasa.
# Blok di bawah adalah bentuk yang BENAR, dan sengaja dinonaktifkan.
#
# <FilesMatch "\.(bak|old|save|swp|orig)$">
#     Require all denied
# </FilesMatch>
AddType text/plain .bak

# ---------------------------------------------------------------------------
# 5. HALAMAN STATUS SERVER DIBUKA UMUM
# ---------------------------------------------------------------------------
# mod_status membocorkan daftar permintaan yang sedang berjalan, alamat IP
# klien, dan URL yang sedang diminta. Di server yang benar, blok ini dibatasi
# ke alamat administrator, atau modulnya tidak dimuat sama sekali.
ExtendedStatus On
<Location "/server-status">
    SetHandler server-status
    Require all granted
</Location>

# ---------------------------------------------------------------------------
# 6. LOG AKSES LENGKAP
# ---------------------------------------------------------------------------
# Format combined ikut mencatat Referer dan User-Agent, jadi jejak perkakas
# otomatis seperti nikto dan hydra kelihatan jelas. Berkasnya ditulis ke
# /var/log/lab, folder yang sama dengan ./jejak di folder lab, sehingga bisa
# dibaca dari toolbox lewat /lab/jejak tanpa perintah docker tambahan.
CustomLog "/var/log/lab/akses-httpd.log" combined
